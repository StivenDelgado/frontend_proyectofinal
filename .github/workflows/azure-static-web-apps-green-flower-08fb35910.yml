name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - production
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - production

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Checkout the code
      - uses: actions/checkout@v3

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Build the app with Vite
      - name: Build the App
        run: npm run build

      # Deploy to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_FLOWER_08FB35910 }}
          app_location: "/" # Ruta raíz del proyecto
          output_location: "dist" # Carpeta generada por Vite para los archivos de producción
          deployment_action: "upload"
